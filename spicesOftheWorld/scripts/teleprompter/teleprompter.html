<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fudi People Teleprompter</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:#777;--accent:#f5a623}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 14px;background:#111;border-bottom:1px solid #333;font-size:14px;transition:opacity .3s}
#bar.hide{opacity:0;pointer-events:none}
#bar button,#bar select{background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer}
#bar button.go{background:var(--accent);color:#000;font-weight:bold}
#bar label{display:flex;align-items:center;gap:6px;color:#bbb}
#stage{position:fixed;inset:0;overflow-y:scroll;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
#text{max-width:1100px;margin:0 auto;padding:45vh 5vw 70vh;text-align:center;font-weight:bold;line-height:1.35}
#text.mirror{transform:scaleX(-1)}
.ep{color:var(--accent);font-size:.7em;margin-bottom:1.5em}
.l{margin:.15em 0}
.gap{height:1.4em}
.cue{height:3px;background:#333;margin:2.2em auto;width:40%}
#line{position:fixed;left:0;right:0;top:45%;height:0;border-top:2px dashed rgba(245,166,35,.35);pointer-events:none;z-index:3}
#help{position:fixed;bottom:8px;right:12px;color:var(--dim);font-size:12px;z-index:4}
</style></head><body>
<div id="bar">
 <label>Episode <select id="ep"></select></label>
 <button class="go" id="play">▶ Play (Space)</button>
 <label>Speed <input type="range" id="speed" min="1" max="20" value="6"><span id="sv">6</span></label>
 <label>Size <input type="range" id="size" min="28" max="110" value="64"><span id="zv">64</span></label>
 <label><input type="checkbox" id="mirror"> Mirror</label>
 <button id="top">⏮ Top</button>
 <button id="full">⛶ Fullscreen</button>
</div>
<div id="line"></div>
<div id="stage"><div id="text"></div></div>
<div id="help">Space = play/pause · ↑/↓ = speed · +/- = size · M = mirror · Home = top · H = hide bar</div>
<script>
const DATA={"2": {"title": "Senegal — Yassa & Grains of Selim", "paras": [["Today we're going to Senegal —", "the actual birthplace of jollof rice,", "and the specific place", "where one of last episode's spices gets its smoky secret."], ["There's one pot of jollof I still", "measure every other plate against — my mum's.", "Growing up, my best friend's mum also made incredible jollof —", "she was Senegalese,", "and at the time I didn't think anything of that, I", "just knew hers tasted different from anyone else's.", "She'd cook it in this huge,", "blackened pot nobody else was allowed to touch,", "and I can still picture the exact moment she lifted", "that lid — thick, smoky,", "tomatoey steam rolling out before", "you'd even seen the rice underneath.", "Everyone said their own jollof was the best.", "Looking back now,", "hers actually had a reason to be one of the best I have tasted —", "but no jollof will ever measure up to my mum's."], ["Jollof rice — one of the most", "recognisable dishes to come out of West Africa —", "didn't start in Nigeria or Ghana.", "It started in Senegal.", "Senegal sits on the Francophone side", "of West Africa's colonial-era language line,", "and that split still shows up in the cooking today."], ["Jollof travelled — east, across West Africa,", "all the way to Nigeria and Ghana.", "And by the time it got there,", "it had picked up grains of paradise", "and grains of selim —", "the same two spices from last episode's Yaji.", "Grains of selim itself has its own long trade story too —", "it went north to Europe in the Middle", "Ages as a cheaper stand-in for black pepper,", "until the Portuguese opened a direct sea route to Asia", "and the world moved on to the real thing.", "Senegal never did."], ["Grains of selim's musky character", "comes from a compound called fenchone.", "But here's the part that's specific to Senegal —", "the pods are traditionally smoked during drying there,", "and that's what gives them their distinctive musky,", ing them on a farm in Sidcup,", "and letting a new place add its own layer,", "the same way Nigeria once did to a Senegalese rice dish."], ["Full written recipe", "and the exact blend I used are up at fudipeople.com."]]}, "3": {"title": "Ethiopia — Niter Kibbeh & Fenugreek", "paras": [["There's a small tin of berbere sitting on my spice shelf", "that I didn't grow myself —", "picked up years ago from an Ethiopian", "trader at a market stall in London,", "who cracked the lid open before I'd even paid", "so I could smell it.", "Deep, smoky, chilli-forward —", "nothing like anything in my own Ghanaian kitchen,", "warm, earthy, properly fiery.", "That one smell planted the seeds for something else —", "realising Fudi People was never meant to be", "just a Ghana story.", "Spices of Africa was always meant to be the whole continent,", "and Ethiopia's the place that actually proved it to me."], ["Ethiopia, Somalia, Eritrea — the Horn of Africa.", "Addis Ababa is home to Africa's largest spice market.", "The signature spices here are korarima —", "that's Ethiopian or \"false\" cardamom —", "fenugreek, chilli pepper,", "true cardamom, cumin, and coriander."], ["Fenugreek might be the oldest spice we've covered yet —", "the earliest seeds ever found came", "from an archaeological site in Iraq,", "dating back to 4000 BCE.", "They turned up in Tutankhamun's tomb in Egypt too.", "By Roman times it was so common it was just cattle fodder —", "that's actually where the name comes from,", "Latin for \"Greek hay.\" A Greek physician called Dioscorides wrote", "about it as a spice crop in the 1st century CE.", "These days it's a staple across Iran,", "West Asia, India, Sri Lanka —", "and it's spread worldwide through commercial curry powder,", "where it's a key ingredient."], ["Fenugreek's flavour comes down to a compound called sotolon —", "sweet, like maple syrup or caramel.", "There's woody caryophyllene in there too,", "and if you toast the seeds before using them,", "you get these nutty, roasted,", "almost coffee-and-chocolate notes", "from compounds called pyrazines.", "That's the move — toast them first."], ["And fenugreek's one of the better-supported", "spices in this whole series health-wise —", "research genuinely backs it for blood sugar,", "which is exactly the kind of everyday", "benefit worth knowing sits inside something this old.", "It's in good company here, too: the turmeric", "that colours niter kibbeh has", "real trial evidence for joint pain,", "cumin brings its own digestive and metabolic research,", "and ginger is about the best-backed", "spice going for settling the stomach."], ["This is Ethiopia's spiced clarified butter,", "and for once I've actually got real measurements for you.", "Melt 500 grams of unsalted butter with chopped onion,", "garlic, grated ginger, fenugreek seeds,", "ground cumin, korarima or cardamom seeds,", "turmeric, dried oregano, basil, and sage.", "Simmer it for 20 minutes, then strain it through muslin."], ["Niter kibbeh isn't a finished dish on its own —", "it's the base under Ethiopia's most famous stews.", "Kitfo, the minced-beef dish, gets it stirred straight through;", "misir wat, the red lentil stew, leans on it too.", "But the dish it's most identified with is doro wat,", "Ethiopia's national chicken stew —", "so that's the one we're building today."], ["That tin of berbere is still sitting on my shelf,", "and it's part of why I can say this properly now.", "Here's what gets me about fenugreek —", "it didn't stay in one place.", "Same seed, cattle fodder in Rome, medicine in medieval Europe,", "the base of Ethiopia's niter kibbeh,", "and now it's in curry powders all over the world.", "One seed, three continents — Africa, South Asia,", "East Asia — which is exactly what Fudi People is:", "one brand, three regions,", "all carrying the same instinct forward."], ["Full written recipe", "and the exact blend I used are up at fudipeople.com."]]}, "4": {"title": "Sierra Leone & Liberia — Pepper r soup is built to feel like it's doing you good", "while it warms you up."], ["And that \"doing you good\" feeling isn't just in your head —", "ginger's one of the", "most genuinely well-evidenced spices going,", "especially for digestion", "and nausea, and uda,", "the same grains of selim from episode one,", "has real research behind it too,", "for gut and respiratory health.", "The Scotch bonnet adds capsaicin's own file —", "heart health, circulation, a small metabolic bump —", "and calabash nutmeg has been used as a medicine across", "West Africa for about as long as it's been a spice."], ["Sierra Leone's pepper soup base", "is Scotch bonnet peppers, garlic,", "ginger, country onion — a small,", "intensely flavoured wild onion —", "and often uda and calabash nutmeg alongside it,", "all simmered together with goat, fish, or chicken."], ["That same Scotch bonnet-ginger base", "turns up all over Sierra Leonean", "and Liberian cooking,", "not just pepper soup — cassava leaf stew", "and groundnut soup both lean on it too.", "But pepper soup's the one that pairs", "with what we're making today."], ["In Liberia, that same pepper soup gets served", "with dumboy — cassava,", "boiled and pounded until it's smooth", "and stretchy, almost like a dough.", "It's eaten communally, everyone pulling from the same bowl —", "it's less a side dish, more a whole way of eating together."], ["That tin of uda is still on my shelf,", "right next to the grains of selim.", "That's three episodes now", "where grains of selim has shown up — Yaji in Ghana", "and Nigeria, café touba in Senegal,", "and now uda in Sierra Leone's pepper soup.", "One spice, the whole coast.", "And Liberia's own story —", "people finding their way back to West Africa", "and building something new out of what they carried with them —", "isn't so different from what I'm doing now,", "carrying Ghana's spices to a farm in London", "and building Fudi People out of it."], ["Full written recipe", "and the exact blend I ewhere new,", "but making sure the story travels", "with them, the way it always has."], ["Full written recipe", "and the exact blend I used are up at fudipeople.com."]]}, "6": {"title": "East Africa — Zanzibar Pilau & Ginger", "paras": [["Today we're heading to East Africa — Kenya, Tanzania, Uganda,", "and an island that was once one", "of the wealthiest spice ports on earth."], ["I've got two jars sitting next to", "each other on my own kitchen shelf —", "one from Spices of Africa, one from Spices of South Asia.", "Picking up a cardamom pod while researching this episode,", "doing the reading on Zanzibar,", "it hit me that this one pod", "is basically the bridge between those two jars.", "Ginger, clove, cardamom —", "moving through Zanzibar from India centuries ago,", "and now sitting on my own shelf, one brand,", "two lines, connected by one spice."], ["Kenya, Tanzania, Uganda — East Africa.", "But the real centre of this episode is Zanzibar", "and its archipelago,", "the historic epicentre of East Africa's spice trade.", "Ginger gives this region's cooking its characteristic heat;", "cardamom, clove,", "and cinnamon bring the sweet,", "aromatic side you'll recognise from", "the region's own version of chai."], ["Over 2,000 years of trade with Arabia,", "Persia, and India brought cloves,", "ginger, pepper, cinnamon, and cardamom into Zanzibar.", "Ginger and cardamom travelled furthest inland;", "the coast itself leaned on turmeric", "and coriander alongside coconut.", "Zanzibar's clove trade really took off", "in the 1500s under Omani settlers,", "and it made the island genuinely wealthy.", "Ginger has its own long road too —", "Arab traders carried it to Greece", "and Rome as far back as the 4th century BCE,", "and by the 13th century it was being grown in both East", "and West Africa — Zanzibar and Ghana,", "opposite coasts, the same plant."], ["Ginger's heat comes from gingerols,", "and zingiberene is what gives it that unmistakable aroma.", "But here's the part that gets me — when you dry ginger,", "it actually gets hotter, not milder.", "Gingerol converts into shogaol, which carries twice the heat,", "even though you lose some of", "the fresh citrus notes along the way."], ["Ginger's actually one of the", "most solidly research-backed spices out there —", "nausea relief alone is well-established clinically,", "not just folk wisdom, and clove holds its own too,", "especially for pain relief and fighting bacteria.", "The rest of the pilau blend keeps up:", "cinnamon has real trial evidence for blood sugar,", "cardamom a heart-health angle,", "and cumin its own digestive and metabolic research.", "A bowl of pilau rice is carrying more than flavour."], ["Toast and grind whole cumin seeds, black peppercorns,", "cloves, cardamom seeds, and cinnamon.", "Stir that straight into the pan when", "you're frying onions down for pilau rice."], ["That same warm cumin-cardamom-clove profile", "shows up in Zanzibar biryani too —", "a close cousin,", "layered instead of one-pot — and in kuku paka,", "East Africa's coconut chicken curry.", "Pilau's the simplest way to taste it first,", "so that's where we're starting."], ["That toasted, fragrant masala goes straight into the onions,", "and the rice cooks in it from there —", "every grain carrying that spice.", "Simple, but it's the whole East African coast in one pot."], ["Those two jars are still sitting on my shelf,", "right next to each other.", "This is the one —", "the book calls East Africa the strongest", "direct link to South Asia we've got,", "because the same routes", "that built Zanzibar's spice trade carried cardamom,", "clove, and pepper in from India in the first place.", "And ginger ties it back to home for me too —", "by the 1200s it was growing in Ghana", "just as much as it was here.", "Same plant, opposite coasts, one continent.", "Wherever this series goes next,", "it was already connected back to Ghana before I even started."], ["Full written recipe", "and the exact blend I used are up at fudipeople.com."]]}};
const $=id=>document.getElementById(id);
const stage=$('stage'),text=$('text');
const epSel=$('ep');
for(const k of Object.keys(DATA)){const o=document.createElement('option');o.value=k;o.textContent='Ep '+k+' — '+DATA[k].title;epSel.appendChild(o)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function load(k){
  let h='<div class="ep">EPISODE '+k+'<br>'+esc(DATA[k].title)+'</div><div class="gap"></div><div class="gap"></div>';
  for(const p of DATA[k].paras){for(const l of p){h+='<div class="l">'+esc(l)+'</div>'}h+='<div class="cue"></div>'}
  h+='<div class="ep">— END OF EPISODE '+k+' —</div>';
  text.innerHTML=h;stage.scrollTop=0;pos=0;stop();
  try{localStorage.setItem('tp_ep',k)}catch(e){}
}
let playing=false,raf=null,last=0,pos=0;
function tick(t){
  if(!playing)return;
  const dt=(t-last)/1000;last=t;
  pos+=parseInt($('speed').value)*8*dt;
  stage.scrollTop=pos;
  if(stage.scrollTop+stage.clientHeight>=stage.scrollHeight-2){stop();return}
  raf=requestAnimationFrame(tick);
}
function play(){playing=true;pos=stage.scrollTop;last=performance.now();$('play').textContent='⏸ Pause (Space)';raf=requestAnimationFrame(tick)}
function stop(){playing=false;cancelAnimationFrame(raf);$('play').textContent='▶ Play (Space)'}
$('play').onclick=()=>playing?stop():play();
$('top').onclick=()=>{stop();stage.scrollTop=0;pos=0};
$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
epSel.onchange=()=>load(epSel.value);
function setSize(v){v=Math.max(28,Math.min(110,v));$('size').value=v;$('zv').textContent=v;text.style.fontSize=v+'px'}
function setSpeed(v){v=Math.max(1,Math.min(20,v));$('speed').value=v;$('sv').textContent=v}
$('size').oninput=e=>setSize(+e.target.value);
$('speed').oninput=e=>setSpeed(+e.target.value);
$('mirror').onchange=e=>text.classList.toggle('mirror',e.target.checked);
stage.addEventListener('wheel',()=>{pos=stage.scrollTop});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();playing?stop():play()}
  else if(e.key==='ArrowUp'){e.preventDefault();setSpeed(+$('speed').value+1)}
  else if(e.key==='ArrowDown'){e.preventDefault();setSpeed(+$('speed').value-1)}
  else if(e.key==='+'||e.key==='='){setSize(+$('size').value+4)}
  else if(e.key==='-'){setSize(+$('size').value-4)}
  else if(e.key==='m'||e.key==='M'){$('mirror').checked=!$('mirror').checked;$('mirror').onchange({target:$('mirror')})}
  else if(e.key==='Home'){$('top').onclick()}
  else if(e.key==='h'||e.key==='H'){$('bar').classList.toggle('hide')}
});
setSize(64);let start='2';try{start=localStorage.getItem('tp_ep')||'2'}catch(e){}
if(!DATA[start])start='2';
epSel.value=start;load(start);
</script></body></html>
