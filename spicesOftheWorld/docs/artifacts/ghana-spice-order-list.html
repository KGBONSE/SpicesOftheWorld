<script>
  const data = JSON.parse(document.getElementById('data').textContent);

  document.getElementById('intro').textContent =
    "Every dried spice, seed, herb, and named chilli that appears across all 34 Fudi People blends — " +
    data.items.length + " unique items — pulled directly from each blend's ingredient list. " +
    "Fresh produce, liquids, and plain sugar/salt were left out on purpose, since the point here is what " +
    "needs sourcing as a dried spice. Reference-photo links are visual sanity checks only — always confirm " +
    "the exact product and grade with the supplier directly.";

  const priorityList = document.getElementById('priority-list');
  data.specialty.forEach(s => {
    const div = document.createElement('div');
    div.className = 'priority-item';
    div.innerHTML = `<span class="name">${s.name}</span><span class="ep">${s.episode}</span><div class="note">${s.note}</div>`;
    priorityList.appendChild(div);
  });

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const headingEl = document.getElementById('list-heading');
  const prioritySection = document.getElementById('priority-section');

  function render(filter) {
    const q = filter.trim().toLowerCase();
    const filtered = data.items.filter(it =>
      !q ||
      it.spice.toLowerCase().includes(q) ||
      it.appears.toLowerCase().includes(q) ||
      it.notes.toLowerCase().includes(q)
    );
    listEl.innerHTML = filtered.map(it => `
      <div class="card">
        <div class="name">${it.spice}</div>
        <div class="appears">${it.appears}</div>
        ${it.notes !== '—' ? `<div class="notes">${it.notes}</div>` : ''}
        <div class="meta">
          <span class="source">${it.source}</span>
          <span>${it.photo.replace('</a>', ' →</a>')}</span>
        </div>
      </div>
    `).join('');
    emptyEl.style.display = filtered.length ? 'none' : 'block';
    headingEl.textContent = q ? `${filtered.length} match${filtered.length === 1 ? '' : 'es'}` : `All ${data.items.length} spices`;
    countEl.textContent = q ? `${filtered.length} of ${data.items.length} spices` : `${data.items.length} spices · ${data.specialty.length} Ghana-priority items`;
    prioritySection.style.display = q ? 'none' : 'block';
  }

  document.getElementById('search').addEventListener('input', e => render(e.target.value));
  render('');
</script>
